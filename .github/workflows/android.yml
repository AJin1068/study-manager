name: android

on:
  push:
    tags:
      - 'phone-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # gen/android is generated, not committed: init it, then connect the Kotlin blocker plugin.
      - name: Generate the Android project and wire the blocker plugin
        working-directory: phone/src-tauri
        run: |
          pnpm --dir ../.. exec tauri android init --ci
          node ../scripts/wire-blocker.mjs

      - name: Build release APK
        working-directory: phone/src-tauri
        run: pnpm --dir ../.. exec tauri android build --apk

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "signing key is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME"/build-tools/*/apksigner sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out phone/study-manager-phone.apk phone/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: study-manager-phone-apk
          path: phone/study-manager-phone.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/phone-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" phone/study-manager-phone.apk --title "$GITHUB_REF_NAME" --generate-notes
