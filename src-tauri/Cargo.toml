[package]
name = "study-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "study_manager_lib"
path = "src/lib.rs"

[[bin]]
name = "study-manager"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSProcessInfo", "NSString", "NSArray", "NSURL", "NSAppleEventDescriptor", "NSAppleEventManager"] }

[dev-dependencies]
chrono-tz = "0.10"

# The native backends must be named: without one, keyring silently falls back to a mock store.
# remote::secrets runs a write/read/delete self-check at startup for exactly that reason.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies.keyring]
version = "3"
